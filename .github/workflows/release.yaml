# A release. Manual, semantic, and the only thing in this repository that
# produces an artefact meant to leave it.
#
# WHAT THIS EXISTS FOR. The deliverable of this project is source code and
# documentation; hosting is out of scope. These artefacts exist so that the
# client is not handed a repository full of pytest, planning notes and build
# intermediates and left to work out which parts are the product. Someone
# should be able to open the release page and run the system without reading
# the source - which is why the release notes below are treated as a
# deliverable in their own right and not as a changelog.
#
# WHAT IT PUBLISHES
#   * three images tagged `X.Y.Z` and `latest`;
#   * the wheel and the sdist, attached to a GitHub Release;
#   * release notes carrying the five deployment facts, in the text.
#
# WHAT IT DOES NOT DUPLICATE. The suite, the per-architecture builds and the
# manifest assembly are the same three reusable workflows ci.yaml calls. That
# is the point: two copies of a `docker build` loop drift, and the copy that
# drifts is this one, because nobody watches a workflow that runs four times a
# year. A release therefore runs the same tests, through the same steps, and
# reads its published tags back out of the registry the same way.
#
# VERSION STAMPING. `pyproject.toml` carries a base version that nothing else
# records; this workflow overrides it from the input, for the wheel, the sdist
# and the three images alike, through .github/actions/stamp-version. See the
# `version` job in ci.yaml for what alpha builds stamp instead, and why it is
# not simply `<base>+<sha>`.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z with no leading v (e.g. 1.0.0)'
        required: true
        type: string

  # ==========================================================================
  # TEMPORARY - REMOVED BEFORE THIS BRANCH IS FINISHED. See the DRY RUN note
  # in the `prepare` job. GitHub only offers manual dispatch for a workflow
  # that already exists on the DEFAULT branch, so this file cannot be
  # dispatched until it is merged - and a release workflow first exercised on
  # the real 1.0.0 is one that has never been tested. This trigger, and the
  # `|| '<version>'` fallback below, are the only two differences between the
  # file that gets exercised and the file that ships.
  # ==========================================================================
  push:
    branches:
      - 'build/**'

# Never cancel a release in flight. `cancel-in-progress: true` would be right
# for CI and catastrophic here: the window it would interrupt is between
# `imagetools create` and `gh release create`, which leaves images published
# under a version that has no release, no notes and no wheel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:

  # ===========================================================================
  # Refuse a bad version before anything is built, tagged or published.
  # ===========================================================================
  prepare:
    name: Validate the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          # The only place the release version enters this workflow.
          #
          # DRY RUN, TEMPORARY: the `|| '...'` supplies a version on the push
          # trigger above, which has no inputs. Both are removed together once
          # the workflow has been exercised. `0.0.1-rc1` was rejected by the
          # check below on the previous commit, which is what proves the
          # fail-early path on a real run; this is the scratch version the full
          # dry run publishes and then deletes.
          RAW_VERSION: ${{ inputs.version || '0.0.1' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # FAIL EARLY, AND ON THE VALUE ITSELF. Everything downstream - the
          # image tags, the wheel filename, the git tag, the release title -
          # is this string. A version that gets as far as being pushed to a
          # registry and only then turns out to be unparseable is a tag nobody
          # can delete without `delete:packages`, so the check belongs in a
          # five-second job at the front rather than anywhere later.
          #
          # Strictly X.Y.Z. No `v` prefix (the git tag adds one; the image tag
          # must not have one), no pre-release suffix, no build metadata: this
          # project has one release channel, and the alpha channel is CI's
          # `.dev0+<sha>` images, which are produced by a different workflow
          # and cannot be requested here.
          #
          # STRICTER THAN `^[0-9]+\.[0-9]+\.[0-9]+$` IN ONE RESPECT, on
          # purpose: no leading zeroes. `01.0.0` matches that looser pattern
          # and is a perfectly good git tag and image tag - but PEP 440
          # NORMALISES it, so the wheel would come out as `kaicalc-1.0.0` while
          # the images said `01.0.0`. The check that catches that lives in the
          # `dist` job, which runs after the images have already been pushed;
          # catching it here instead costs one character of regex.
          if ! printf '%s' "$RAW_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error title=Malformed version::'${RAW_VERSION}' is not X.Y.Z. Give three dot-separated integers with no leading 'v', no pre-release suffix and no build metadata - for example 1.0.0. Nothing has been built, tagged or published."
            exit 1
          fi

          TAG="v${RAW_VERSION}"

          # Refuse to re-release. `gh release create` would fail on an existing
          # tag anyway - but only after the images had been built and pushed,
          # by which point `X.Y.Z` in the registry points at the new build and
          # the release page still describes the old one. That is a worse state
          # than either outcome on its own, so it is checked here.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::${TAG} is already in this repository. A released version is immutable: release the next patch version instead, or - only if this one was never handed to anybody - delete the tag and its release first. Nothing has been built or published by this run."
            exit 1
          fi

          echo "version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"             >> "$GITHUB_OUTPUT"
          echo "releasing ${RAW_VERSION} as ${TAG} from ${GITHUB_SHA}"

  # ===========================================================================
  # The suite. The same one CI runs - a release cut from a red commit is
  # exactly what sharing this costs nothing to prevent.
  # ===========================================================================
  test:
    name: Suite
    needs: prepare
    uses: ./.github/workflows/_test.yaml

  # ===========================================================================
  # The images, per architecture, independent and mutually non-fatal.
  # ===========================================================================
  build:
    name: Images
    needs: [prepare, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
      arch_tag_prefix: ${{ needs.prepare.outputs.version }}
      push: true

  # ===========================================================================
  # `X.Y.Z` and `latest`, assembled from whatever survived and read back.
  # ===========================================================================
  #
  # `latest` moves on every release, including a release of an older version
  # than the current one. That is a deliberate simplification and not an
  # oversight: this project cuts releases by hand, a handful of times, and a
  # "is this newer than the current latest?" comparison is more machinery than
  # the situation earns. The notes tell deployers to pin the version tag.
  manifest:
    name: Semantic tags
    needs: [prepare, test, build]
    # `always()` so a failed or never-scheduled arm64 leg does not skip this
    # job - shipping whatever succeeded is the whole design. The tests must
    # still have passed.
    if: always() && needs.test.result == 'success'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-manifest.yaml
    with:
      arch_tag_prefix: ${{ needs.prepare.outputs.version }}
      tags: ${{ needs.prepare.outputs.version }} latest
      heading: Release images for `${{ needs.prepare.outputs.version }}`

  # ===========================================================================
  # The wheel and the sdist, stamped to match.
  # ===========================================================================
  dist:
    name: Wheel and sdist
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version the images run and the suite is tested on. The wheel is
          # `py3-none-any`, so this does not change what is produced - it
          # changes which interpreter's setuptools produced it, which is one
          # fewer difference between this artefact and the one inside the
          # images.
          python-version: '3.11'

      - name: Stamp the version into pyproject.toml
        # The SAME action the image build uses. If these two stamped
        # differently, the release page would offer a wheel whose version did
        # not match the images published beside it, and nothing would raise.
        uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Build
        # `python -m build` produces both, and produces the sdist first and the
        # wheel FROM the sdist - so a file missing from MANIFEST.in shows up
        # here as a broken wheel rather than as a broken install six weeks
        # later.
        #
        # NAMED AND NOT HIDDEN: build isolation fetches setuptools from PyPI
        # unpinned, exactly as pip does inside the Dockerfiles. Wheel
        # CONSTRUCTION is therefore still time-dependent even though the
        # runtime dependency set is pinned by docker/constraints.txt. Carried
        # forward from task 2's review; unchanged here.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/
          ls -l dist/

      - name: Assert the artefacts carry the released version
        # ASK THE ARTEFACT. The stamp action re-parses pyproject.toml, which
        # proves the source tree and not the output; this reads the version out
        # of the built wheel's own metadata, which is the thing that gets
        # attached to the release page.
        env:
          WANT: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import sys
          import zipfile
          from email.parser import BytesParser

          want = os.environ["WANT"]
          dist = pathlib.Path("dist")

          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected one wheel and one sdist, got {wheels} {sdists}")

          # Out of the wheel's METADATA, not out of its filename: a filename is
          # a naming convention and METADATA is what pip installs and what
          # `pip show kaicalc` later reports.
          with zipfile.ZipFile(wheels[0]) as zf:
              name = next(n for n in zf.namelist()
                          if n.endswith(".dist-info/METADATA"))
              meta = BytesParser().parsebytes(zf.read(name))
          got = meta["Version"]

          if got != want:
              sys.exit(f"wheel METADATA says Version: {got}, expected {want}")
          if wheels[0].name != f"kaicalc-{want}-py3-none-any.whl":
              sys.exit(f"unexpected wheel filename {wheels[0].name}")
          if sdists[0].name != f"kaicalc-{want}.tar.gz":
              sys.exit(f"unexpected sdist filename {sdists[0].name}")

          print(f"verified {wheels[0].name} and {sdists[0].name} at version {got}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # The release itself: the tag, the notes, the two files.
  # ===========================================================================
  publish:
    name: GitHub Release
    needs: [prepare, manifest, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the tag and the release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Render the release notes
        # The notes are the deliverable the client actually reads, so they are
        # prose in .github/release-notes-template.md rather than a heredoc
        # here. The only thing this step does is substitute; if a placeholder
        # is left unfilled it fails, because a release page reading
        # `__VERSION__` is worse than no release.
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          PUBLISHED: ${{ needs.manifest.outputs.published }}
          MISSING: ${{ needs.manifest.outputs.missing_arches }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          published = os.environ.get("PUBLISHED", "").strip()
          missing = os.environ.get("MISSING", "").strip()

          # WHAT THE TAG ACTUALLY HOLDS, read out of the registry by the
          # manifest job and passed through here. Not "amd64 and arm64"
          # written as a constant: on a run where one architecture did not
          # build, a constant would be the release page telling a client the
          # image supports a platform it will refuse to run on.
          if not published:
              arch_line = "the architectures listed in the run summary"
          elif missing:
              arch_line = (
                  f"**{published} only** - {missing} did not build for this "
                  "release, and `docker pull` on that architecture will fail "
                  "with `no matching manifest`"
              )
          else:
              arch_line = published

          text = pathlib.Path(".github/release-notes-template.md").read_text(
              encoding="utf-8")
          for key, value in {
              "__VERSION__": version,
              "__TAG__": os.environ["TAG"],
              "__COMMIT__": os.environ["GITHUB_SHA"],
              "__IMAGE_PREFIX__": os.environ["IMAGE_PREFIX"],
              "__ARCH_LINE__": arch_line,
          }.items():
              text = text.replace(key, value)

          # The HTML comment at the top of the template is a note to whoever
          # edits it, not to whoever reads the release.
          text = re.sub(r"^<!--.*?-->\s*", "", text, flags=re.S)

          left = re.findall(r"__[A-Z_]+__", text)
          if left:
              sys.exit(
                  f"unsubstituted placeholders in the release notes: "
                  f"{sorted(set(left))}"
              )

          pathlib.Path("release-notes.md").write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # --target pins the tag to the commit this run built from, rather
          # than to whatever the branch head has become in the meantime.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Kai Commitment Food Waste Impact Calculator $VERSION" \
            --notes-file release-notes.md \
            --latest \
            dist/*.whl dist/*.tar.gz
          echo "released: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Summarise
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          MISSING: ${{ needs.manifest.outputs.missing_arches }}
          PUBLISHED: ${{ needs.manifest.outputs.published }}
        run: |
          {
            echo "## Released \`${VERSION}\`"
            echo
            echo "* Tag: [\`${TAG}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo "* Commit: \`${GITHUB_SHA}\`"
            echo "* Images: \`${VERSION}\` and \`latest\`, holding ${PUBLISHED:-(see the manifest job)}"
            if [ -n "${MISSING}" ]; then
              echo "* **Incomplete:** \`${MISSING}\` is not in these tags. The release notes say so on the page itself."
            fi
            echo "* Attached: \`kaicalc-${VERSION}-py3-none-any.whl\`, \`kaicalc-${VERSION}.tar.gz\`"
          } >> "$GITHUB_STEP_SUMMARY"

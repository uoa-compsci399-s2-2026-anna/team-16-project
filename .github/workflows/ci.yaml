# CI: the test suite against a real MySQL 8, then the alpha images.
#
# TWO THINGS THIS PIPELINE EXISTS TO GUARANTEE, neither of which a human can be
# relied on to do:
#
#   1. That the suite runs against MySQL 8 and not something that merely
#      accepts the same SQL - see .github/workflows/_test.yaml.
#   2. That the images stay free of tests/, docs/, Journal/ and .superpowers/.
#      That was checked twice by hand, both times by someone who thought to
#      look, and it is one forgotten .dockerignore line away from being false.
#      See the hygiene step in .github/workflows/_build-images.yaml.
#
# WHERE THE WORK ACTUALLY LIVES. This file is a sequence of calls; the three
# jobs it calls are shared verbatim with release.yaml:
#
#   _test.yaml             the suite against MySQL 8
#   _build-images.yaml     the two independent per-architecture builds
#   _publish-manifest.yaml the multi-architecture tags, and the read-back
#
# That is deliberate. Two copies of a `docker build` loop drift, and the copy
# that drifts is the release one, because nobody watches it. A release now runs
# the same tests, builds through the same steps and publishes through the same
# assembly as every push to main.
#
# ARCHITECTURE. amd64 and arm64 are built as two independent, mutually
# non-fatal jobs, and a third job assembles the multi-architecture tag from
# whichever of them actually reached the registry. This repository is PRIVATE,
# so `ubuntu-24.04-arm` is billed by the minute out of an allowance nobody has
# measured; a run that cannot schedule arm64 must still ship a usable amd64
# image rather than shipping nothing. Nothing is gated behind a variable: the
# try-and-report shape covers both "we have arm minutes" and "we ran out on the
# 12th" with no one editing these files.

name: CI

on:
  push:
    branches:
      - main
      # The packaging branches build and push too. Without this, this workflow
      # could not be exercised before it merged - and `workflow_dispatch` is no
      # help, because GitHub only offers manual dispatch for a workflow that
      # already exists on the DEFAULT branch. A workflow that has never run is
      # not finished. The moving tag is branch-derived off main (see
      # `moving_tag` in the `version` job), so `alpha` never points at anything
      # that is not on main.
      - 'build/**'
  # THE `pull_request:` TRIGGER IS BACK, 2026-10-07. It was removed on
  # 2026-08-12 and the removal's own note is kept below, because the thing it
  # gave up is exactly what then happened.
  #
  # WHY IT WAS REMOVED: "The suite against MySQL 8 takes 18 minutes and is the
  # whole cost of a run: a pull request publishes nothing, so its image jobs
  # finish in seconds and `Alpha tag` skips entirely. Eighteen minutes is
  # therefore what every pull request cost, merged or not. In the second half
  # of the semester five people open pull requests continuously and not all of
  # them are headed for `main`, which spends that allowance on branches that
  # never merge."
  #
  # WHY THAT NO LONGER HOLDS: the allowance was the whole argument, and this
  # repository is now PUBLIC, so Actions minutes on standard runners are free.
  # Nothing about the shape of the pipeline had to change to bring this back -
  # `build` is still called with `push: github.event_name != 'pull_request'`
  # and `_build-images.yaml` still gates every push step on `inputs.push`, and
  # `manifest` still carries `github.event_name != 'pull_request'`. A pull
  # request publishes nothing, exactly as the note above says. The
  # infrastructure never left; only the trigger did.
  #
  # AND WHAT THE REMOVAL ACCEPTED CAME TRUE. Its own words: "a change that
  # breaks the suite is now found on `main` instead of before it, so `main`
  # goes red rather than the pull request. `workflow_dispatch` is the
  # mitigation" - and a mitigation that depends on somebody remembering is not
  # one. v1.102 added the browser job in #178. Because this trigger was absent
  # the job never ran on the branch, its FIRST run was the merge commit on
  # `main`, and it was killed at 75 minutes having reported 94 failures of
  # which not one named its cause: `KAICALC_WEB_URL` had been set to a page
  # rather than an origin, so every test in the suite drove the calculator.
  # Finding that took a four-thousand-line log. On a pull request it would have
  # been one red check before the merge.
  #
  # The rule this is an instance of: **a workflow that has never run is not
  # finished**, which is the same sentence the `build/**` entry above gives for
  # its own existence.
  pull_request:
  workflow_dispatch:

# One run per ref. A RUN THAT CAN PUBLISH IS NEVER CANCELLED; A PULL REQUEST'S
# IS, and the condition below is that distinction and nothing more.
#
# A run that publishes must not be interrupted: cancelling one can land inside
# the same `imagetools create` -> push window that release.yaml protects for
# the same reason, and a run killed mid-publish leaves the moving tag torn,
# pointing at one architecture or at nothing. The blast radius is only ever a
# disposable alpha tag that the next run republishes - but "it heals itself
# shortly" is not a property worth relying on when the alternative is queueing.
# So a push to `main` or `build/**`, and a manual dispatch, QUEUE.
#
# A pull request publishes nothing - `build` is called with
# `push: github.event_name != 'pull_request'` and `manifest` skips outright -
# so interrupting one costs a rebuild and no more. Cancelling is what should
# happen there: five people pushing corrections to open branches would
# otherwise queue a 45-minute run behind every superseded one. This is how it
# behaved before 2026-08-12, when the note here read "Cancellation used to be
# allowed on pull requests, where it was safe for one reason: a PR published
# nothing"; restoring the trigger restores the reason with it.
#
# The group stays per-ref either way, which also keeps two pytest processes off
# one database - the deadlock `tests/admin`'s shared-database fixtures hit when
# two runs overlap. Each run gets its own MySQL service container, so that was
# already safe; a per-ref group makes it safe by construction.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write        # GHCR, through GITHUB_TOKEN. No new secret is added.

jobs:

  # ===========================================================================
  # What this run calls itself.
  # ===========================================================================
  version:
    name: Derive the alpha version and tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
      sha_tag: ${{ steps.derive.outputs.sha_tag }}
      moving_tag: ${{ steps.derive.outputs.moving_tag }}
    steps:
      - uses: actions/checkout@v5

      - id: derive
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA:0:7}"

          # THE MOVING TAG. `alpha` means "the head of main", and nothing else
          # is allowed to claim it: a run on a packaging branch gets a
          # branch-derived moving tag instead, so the mechanism is exercised
          # identically without `alpha` ever pointing at unmerged code.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            MOVING="alpha"
          else
            MOVING="$(printf '%s' "${GITHUB_REF#refs/heads/}" \
                      | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._-' '-')"
          fi

          # THE ALPHA VERSION: `<base>.dev0+<short-sha>`.
          #
          # Two properties, both required, and the obvious `<base>+<short-sha>`
          # only gives one of them.
          #
          #   * It cannot be mistaken for a release. `1.0.0.dev0+9a3f21c` is
          #     nobody's idea of a shipped version, and it names the commit it
          #     came from.
          #   * It sorts BELOW the release. This is the part a bare local
          #     segment gets backwards: PEP 440 orders a local version ABOVE
          #     the public version it decorates, so `1.0.0+9a3f21c` > `1.0.0`
          #     and an alpha wheel sitting beside a release in one directory
          #     would be the one pip picked. `.dev0` is what puts it behind:
          #     `1.0.0.dev0+9a3f21c` < `1.0.0`.
          #
          # The base is read from pyproject.toml rather than written here, so
          # there is still exactly one place a version number is spelled out.
          BASE="$(python3 -c '
          import tomllib
          with open("pyproject.toml","rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          ')"
          case "$BASE" in
            *dev*|*+*)
              echo "::error title=pyproject version is not a base version::pyproject.toml says ${BASE}. The base version must be a plain N.N.N; the .dev0+sha suffix is added here, not committed."
              exit 1
              ;;
          esac

          # THE `g` BEFORE THE SHA IS LOAD-BEARING, and it is here because the
          # merge of #198 turned `main` red without a line of application code
          # being wrong.
          #
          # That commit's short SHA was `0739392`: seven hex characters that
          # happen to be seven DECIMAL digits, with a leading zero. PEP 440
          # compares a local version segment made entirely of digits
          # NUMERICALLY, so it normalises one - `0.0.0.dev0+0739392` is the
          # same version as `0.0.0.dev0+739392` and the shorter spelling is the
          # canonical one. The stamp below writes the long form into
          # pyproject.toml, the wheel's metadata comes out carrying the short
          # one, and `_build-images.yaml`'s "does the image say what we asked
          # for" assertion compared the two as strings and failed. Nothing was
          # built wrong; the check was holding the version to a spelling PEP
          # 440 does not allow it to keep.
          #
          # A segment with a letter in it is not numeric and is left alone, so
          # prefixing the SHA fixes it at the source rather than teaching the
          # assertion to normalise - which would have left the image saying
          # `739392` while its own registry tag said `0739392`. `g` for git is
          # setuptools_scm's convention for exactly this reason, so the shape
          # `0.0.0.dev0+g0739392` is one a reader has likely seen before.
          #
          # This had been waiting for a one-in-268 commit: P(first character is
          # `0`) x P(the other six are all digits) = 1/16 x (10/16)^6. The same
          # trap is already documented twenty lines into `release.yaml`, where
          # the version regex forbids `01.0.0` for the identical reason - the
          # knowledge was in the repository, applied to the public segment and
          # not to the local one. `tests/test_ci_alpha_version.py` now holds
          # both halves.
          #
          # The docker tags are unaffected: they come from `sha_tag` below,
          # which is the bare SHA and is not a PEP 440 anything.
          VERSION="${BASE}.dev0+g${SHA}"

          # AND CHECK IT HERE, in a job that takes five seconds, rather than
          # letting the image build find it forty minutes later. #198's merge
          # failed twice at the far end of the pipeline - in `Images / Build
          # amd64` and `arm64`, after both had built three images - and then a
          # third time in `Alpha tag`, which had nothing to assemble because
          # neither build pushed. All three were this one string.
          #
          # The property: the local segment must not be made entirely of
          # digits. That is DELIBERATELY BROADER than the failure - PEP 440
          # only rewrites an all-digit segment that has a leading zero, so
          # `+1234567` would have been fine - and broader is the right
          # direction for a tripwire. With the `g` above, the segment can
          # never be all digits, so this cannot refuse a build that would have
          # worked; it can only catch the `g` going missing, which is the one
          # edit that brings #198 back. A guard calibrated to the exact
          # failure would have passed six commits in seven of the class the
          # failure comes from.
          #
          # No `packaging` import - it is not guaranteed on a runner's python3
          # and `case` needs nothing.
          LOCAL="g${SHA}"
          case "$LOCAL" in
            *[!0-9]*) ;;
            *)
              echo "::error title=The alpha version would be renormalised::local segment ${LOCAL} is all digits, so PEP 440 reads it as a number and ${VERSION} is not the spelling the wheel will carry. Nothing has been built."
              exit 1
              ;;
          esac
          # Lowercase alphanumerics only, for the same reason one step further
          # out: PEP 440 lowercases a local segment and rewrites `_` and `-` as
          # `.`, so anything else here is another spelling that would not
          # survive the round trip. A git short SHA is already lowercase hex;
          # this holds the line if the derivation ever stops being one.
          case "$LOCAL" in
            *[!0-9a-z]*)
              echo "::error title=The alpha version would be renormalised::local segment ${LOCAL} has a character outside [0-9a-z]. PEP 440 lowercases a local segment and rewrites separators, so ${VERSION} is not what the wheel will carry. Nothing has been built."
              exit 1
              ;;
          esac

          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA"         >> "$GITHUB_OUTPUT"
          echo "moving_tag=$MOVING"   >> "$GITHUB_OUTPUT"
          echo "alpha version ${VERSION}; tags ${SHA}, ${MOVING}"

  # ===========================================================================
  # The suite, against MySQL 8.
  # ===========================================================================
  test:
    name: Suite
    uses: ./.github/workflows/_test.yaml

  # ===========================================================================
  # The browser suite, which this workflow did not run at all until v1.102.
  #
  # `test` above says `python -m pytest` with no selector, which reads as the
  # whole suite and was not: 39 modules opened with
  # `pytest.importorskip("playwright.sync_api")`, `playwright` was not a dev
  # dependency, and a collection skip is invisible in the summary. 3487 passed,
  # 62 skipped, against 4696 collected on a developer machine.
  #
  # It runs beside `test` rather than after it, because neither needs the
  # other's output and the two answer on very different clocks.
  # ===========================================================================
  browser:
    name: Browser
    uses: ./.github/workflows/_browser.yaml

  # ===========================================================================
  # The two architecture builds. Independent by construction.
  # ===========================================================================
  build:
    name: Images
    # `browser` is a gate, not an advisory. An image published past a red
    # browser suite is an image whose front end nobody checked, and the front
    # end is most of what this product is. The repository is public, so the
    # minutes this costs are free; if it ever has to be relaxed, relax it here
    # and say why rather than letting it rot into a job nobody reads.
    needs: [version, test, browser]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      arch_tag_prefix: ${{ needs.version.outputs.sha_tag }}
      # Always true since the `pull_request` trigger was removed. Kept, not
      # simplified: restoring that trigger must not silently start publishing
      # images out of pull requests, and this is the guard that stops it.
      push: ${{ github.event_name != 'pull_request' }}

  # ===========================================================================
  # The multi-architecture tag, assembled from whatever survived.
  # ===========================================================================
  manifest:
    name: Alpha tag
    needs: [version, test, build]
    # `always()` so a failed or never-scheduled arm64 leg does not skip this
    # job - that is the whole point. But NOT unconditional: the tests must have
    # passed. The pull-request clause is always true since that trigger was
    # removed, and is kept for the reason the `push:` input above is kept.
    if: always() && needs.test.result == 'success' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_publish-manifest.yaml
    with:
      arch_tag_prefix: ${{ needs.version.outputs.sha_tag }}
      tags: ${{ needs.version.outputs.sha_tag }} ${{ needs.version.outputs.moving_tag }}
      heading: >-
        Alpha images for `${{ needs.version.outputs.sha_tag }}`
        (kaicalc ${{ needs.version.outputs.version }})

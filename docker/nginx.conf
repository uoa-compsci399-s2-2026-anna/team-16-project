# kaicalc-web - the only service that is published, and the only origin the
# browser ever talks to.
#
# THIS FILE IS A TEMPLATE. IT IS NOT WHAT NGINX LOADS.
#
# It is copied into the image as /etc/nginx/kaicalc.conf.template, and
# docker/web-config.sh renders it to /etc/nginx/conf.d/kaicalc.conf at container
# start, filling in the FIVE placeholders below from the environment: the two
# `${KAICALC_CSP_*}` source lists; KAICALC_TRUST_FORWARDED, the `on` or `off`
# that decides whether the two forwarded headers are believed; and
# KAICALC_PUBLIC_HOST / KAICALC_PUBLIC_REDIRECT, the two halves of the https
# redirect, both empty unless `KAICALC_PUBLIC_ORIGIN` is set.
#
# THOSE THREE ARE NAMED WITHOUT THEIR `${}` ON PURPOSE. envsubst substitutes a
# placeholder wherever it appears, comments included, so writing one out here
# would blank this paragraph in the rendered file - which is exactly what the
# line above used to do - and would break the rule docker/web-config.sh relies
# on: a name on the substitution list must occur in this template EXACTLY ONCE,
# at the point it is meant to be replaced. `${KAICALC_CSP_*}` survives only
# because `*` cannot be part of a shell name.
#
# `docker exec kaicalc-web cat /etc/nginx/conf.d/kaicalc.conf` is what is
# actually in force. Everything else here is literal, and the renderer names
# exactly those five variables to envsubst so that nothing else in this file -
# $time_local, $uri, $scheme, $http_host, $host, $request_uri, $remote_addr,
# $proxy_add_x_forwarded_for and the rest - can be eaten.
#
# SAME-ORIGIN IS THE DESIGNED TOPOLOGY AND THE DEFAULT. web/js/api.js builds
#
#     const API_BASE = `${API_ORIGIN}/api/v1`
#
# and API_ORIGIN is empty unless KAICALC_API_ORIGIN is set, so out of the box
# that is `/api/v1` - a relative path, and every call the front end makes goes
# to whatever host served the page. One origin means no CORS and no preflight.
# If a request from the calculator is failing, the fix is in this file. **Do not
# add Access-Control-Allow-Origin to work around a proxy misconfiguration** - it
# would paper over the routing bug and turn a private API into a public one.
#
# Splitting the API onto its own origin is possible and is one variable, not an
# edit here: KAICALC_API_ORIGIN feeds `connect-src` below and web/js/config.js
# together. **That is the point.** The domain used to be written out twice - in
# api.js and in this file - and the two had to agree, failing asymmetrically
# when they did not: a wrong policy makes the feed quietly not load, a wrong URL
# sends the browser to a domain nobody chose. Neither file names a domain now.
# web/js/config.js documents what an operator is taking on by setting it.

# ---------------------------------------------------------------------------
# THE ACCESS LOG, and what it is not allowed to hold.
#
# The base image's `main` format logs $remote_addr, $http_user_agent,
# $http_referer and $http_x_forwarded_for on every request to a calculator
# whose stated position (contract section 2.3) is that it stores nothing
# identifying about a visitor. That claim is written about the database, and
# the database keeps its side of it; a log file on the same host that records
# every address and user agent makes the sentence true and the system's
# behaviour something else.
#
# `kaicalc` replaces it. It keeps what an operator needs to diagnose a
# deployment - time, method, path, status, size, latency - and drops the
# three fields that identify a caller.
#
# **Accept-Language is deliberately absent**, and it is absent from the base
# image's format too, so language negotiation was never logged and still is
# not. It is named here so that adding it later has to be a decision somebody
# writes down rather than a variable somebody appends: the language a visitor
# reads in is a demographic fact about them, and this system negotiates it
# per request precisely so that it can be forgotten when the response is sent.
#
# **$http_cookie is deliberately absent on the same terms, and it matters more
# than it looks.** The language chooser (contract 7.7) stores one cookie,
# `kaicalc_lang`, at `path=/` - which cannot be scoped any narrower, because
# the calculator at `/` and the panel at `/admin` both have to read it. So it
# rides along on every request logged here, including every
# `POST /api/v1/calculate`, and this log line is the single easiest place for
# a stated-forgotten preference to end up written down permanently against a
# timestamp and a path. The API itself receives that cookie and ignores it.
#
# The cookie's value space is closed and carries no entropy, so logging it
# would not identify anybody on its own - but it would sit on the same line as
# the request path and time, and "we do not keep this" would stop being true
# of the deployment while remaining true of the database.
#
# log_format is only legal in the `http` context, and this file is included
# inside it (nginx.conf's `include /etc/nginx/conf.d/*.conf`), which is why
# the directive sits out here rather than in the server block below.
log_format kaicalc '[$time_local] "$request" $status $body_bytes_sent '
                   '$request_time';

# ---------------------------------------------------------------------------
# THE TWO FORWARDED HEADERS, AND WHO IS ALLOWED TO SET THEM.
#
# kaicalc_proxy_headers.conf sends `X-Forwarded-Proto` and `X-Forwarded-For` to
# both applications, and used to build them from `$scheme` and `$remote_addr` -
# from what THIS nginx observed. That is right while this nginx is the
# outermost proxy, and wrong the moment it is not.
#
# It very often is not. A public IPv4 has one port 443, and a client who
# already terminates TLS on that address for another site will put this stack
# behind it:
#
#     browser --https--> their nginx :443 --http--> this nginx :18080
#
# DNS, certificates and hosting are out of this project's deliverable, but
# "behaves correctly behind a TLS terminator somebody else operates" is a
# property the product owes, and in that shape `$scheme` is `http` and
# `$remote_addr` is the edge. Every visitor arrives as one address, which is
# precisely the state admin/config.py names as the cost of getting this wrong:
# "the rate limit becomes one counter shared by every visitor and a single
# blocked address blocks everyone".
#
# THE FIX IS NOT "FORWARD WHAT CAME IN, FALL BACK TO WHAT WE SAW".
# Unconditionally, that hands every header below to whoever connects. The two
# are not equally dangerous and the difference is worth stating:
#
#   * A forged `X-Forwarded-Proto: https` marks the staff session cookie
#     `Secure`, so the browser stops sending it over http. Self-inflicted.
#   * A forged `X-Forwarded-Proto: http` on a request that really is https
#     takes `Secure` off a live session cookie. That is the direction that
#     costs something, and it is reachable by anyone who can address this
#     nginx directly.
#   * A forged `X-Forwarded-For` lets a caller name their own address:
#     out of the rate-limit bucket, out of the `ip_block` list, and into
#     whatever else reads it.
#
# THE TWO SCHEME BULLETS ARE THE HEADER'S SEMANTICS, NOT THIS TREE'S BEHAVIOUR
# TODAY, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. `X-Forwarded-For` has a
# reader: db/detection.py's `client_ip` takes it out of `request.headers`, so
# that bullet is live and this file is what governs it. `X-Forwarded-Proto`
# reaches nothing at present - `SESSION_HTTPS_ONLY` is a static setting, so the
# cookie's `Secure` flag is not derived from the request and cannot be forged
# off it, and uvicorn's ProxyHeadersMiddleware resolves `forwarded_allow_ips`
# to 127.0.0.1 while the peer it sees here is this container's network address,
# so it declines to apply either header to the ASGI scope. Sending the truthful
# value is still this header's contract, and the two things that break the
# moment anything honours it are already in the tree: `request.url_for` builds
# absolute URLs from the scheme (sqladmin's 307 from /admin to /admin/), and
# admin/language_view.py's `is_same_origin` compares the browser's `Origin`
# against `request.url.scheme`. Contract section 7.8.1 records why turning
# uvicorn's own proxy handling on is a separate decision and not this one.
#
# So believing either header is an OPT-IN: `KAICALC_TRUST_FORWARDED_HEADERS`,
# rendered into the `map` below as the literal `on` or `off` by
# docker/web-config.sh, which refuses anything that is not a boolean.
#
# WHY IT IS NOT `PROTECTION_TRUSTED_PROXY`, WHICH ALREADY EXISTS.
# That variable answers a different question about a different hop: may the
# applications believe the `X-Forwarded-For` THIS nginx sends them? The
# shipped production answer is yes - and it is yes precisely because this
# nginx overwrites the header rather than trusting it. Reusing it here would
# mean that turning on application trust also, silently, made this proxy
# believe headers from any caller who reaches it - one switch meaning two
# things in two layers, which is its own defect. They are independent facts
# and every combination is a real deployment:
#
#     nginx trusts   apps trust   the deployment
#     ------------   ----------   ------------------------------------------
#     off            on           SHIPPED. This nginx is the edge and the only
#                                 way in; api/admin publish no host port
#     off            off          the direct ports are back on
#                                 (docker/compose.direct-ports.yaml), so a
#                                 caller could forge the header and the apps
#                                 must not believe it. Also a bare `./run.sh`
#     on             on           somebody else's TLS terminator in front
#     on             off          does nothing; web-config.sh warns at start
#
# THE SHIPPED ROW MOVED WHEN THE api AND admin `ports:` BLOCKS BECAME OPT-IN,
# AND ONLY THE RIGHT-HAND COLUMN MOVED. Unpublishing those ports is a
# statement about who can reach the APPLICATIONS, and it is what let the apps
# start believing this proxy. It is not a statement about who can reach
# :18080, so the left-hand column did not move and must not be moved by the
# same reasoning.
#
# WHAT THIS DOES NOT DO: it does not check WHICH address the request came
# from. nginx has `set_real_ip_from`/`real_ip_header` for that, and it would
# be the stronger control - but it needs the edge's address written into this
# configuration, and this repository has just finished removing the last
# hard-coded host from its images (see the header of this file). An operator
# who turns this on is stating that the only route to :18080 is through their
# edge. That is the SAME SHAPE of statement PROTECTION_TRUSTED_PROXY asks for
# and a different subject: the `ports:` removal in docker/compose.yaml settles
# who can reach api and admin, and settles nothing about who can reach :18080,
# which is why that removal moved one default and not this one.
#
# NOTHING HERE IS LOGGED. The `kaicalc` log format above carries no address
# and no header, and gains none: these variables exist only to be handed to
# `proxy_set_header`. Contract 2.3 forbids storing an address, and the access
# log was found violating that once already.
# ---------------------------------------------------------------------------

# An http-level constant. nginx has no `set` outside a server/location block,
# so the idiom for one is a `map` whose every input maps to the same literal;
# `$host` is the source only because a `map` needs one. This is the single
# occurrence of the placeholder, and web-config.sh guarantees it renders to
# `on` or `off` and refuses to start the container otherwise.
map $host $kaicalc_trust_forwarded {
    default "${KAICALC_TRUST_FORWARDED}";
}

# THE SCHEME THE BROWSER ACTUALLY USED.
#
# Untrusting (and for any inbound value that is not exactly `http` or
# `https`): `$scheme`, what this server was reached on. The value is
# whitelisted rather than passed through because it ends up in
# `request.url.scheme` in Starlette, from which every absolute redirect
# `request.url_for` builds is assembled - a header is not a safe thing to
# interpolate into a URL, and there are exactly two legal values.
#
# What reaches the application is the LITERAL ON THE RIGHT of the matching
# line, never the caller's own string. nginx matches `map` string keys
# case-insensitively and a scheme is case-insensitive too (RFC 3986 3.1), so
# `HTTPS` is believed and arrives as `https` - refusing it would silently
# downgrade a request from an edge that happens to shout, and passing it
# through would leave an application comparing `scheme == "https"` defeatable
# by casing. Normalising is the only one of the three that is right.
map "$kaicalc_trust_forwarded:$http_x_forwarded_proto" $kaicalc_client_proto {
    default    $scheme;
    "on:http"  http;
    "on:https" https;
}

# THE ADDRESS THE VISITOR ACTUALLY CAME FROM.
#
# Untrusting: `$remote_addr`, overwritten and never appended - the reasoning
# is in kaicalc_proxy_headers.conf and it is unchanged. Any inbound
# X-Forwarded-For is thrown away, which is what stops a caller naming their
# own address.
#
# Trusting: `$proxy_add_x_forwarded_for`, which is nginx's built-in
# "$http_x_forwarded_for, $remote_addr" - and just `$remote_addr` when the
# inbound header is absent, so the fallback needs no separate branch. Both
# applications read the LEFT-MOST entry (db/detection.py's `client_ip`), which
# is the address the edge recorded; appending this proxy's peer on the right
# keeps the chain intact without changing what is read.
map $kaicalc_trust_forwarded $kaicalc_client_addr {
    default $remote_addr;
    "on"    $proxy_add_x_forwarded_for;
}

# ---------------------------------------------------------------------------
# SENDING A PUBLIC VISITOR WHO ARRIVED IN THE CLEAR TO https, WITHOUT SENDING
# THE HEALTH CHECK ANYWHERE.
#
# THE DEPLOYMENT THAT NEEDS THIS. A router can forward two things to one host:
#
#     public 443    --> the operator's edge --http--> this stack :18080
#     public 18080  ------------------------------->  this stack :18080
#
# The second is a plaintext bypass of the first. It serves /admin in the clear,
# and once `KAICALC_SESSION_HTTPS_ONLY` is true - which it must be the moment
# TLS is in front - the panel's session cookie carries `Secure`, so the browser
# accepts the login, refuses to send the cookie back over http, and bounces to
# the login page with nothing said. A redirect to https is the fix, and it has
# to live HERE because port 80 is where a redirect normally goes and an
# operator may deliberately have no listener on it: an unfirewalled port 80 is
# scanned continuously, and this stack is the only thing in the plaintext path.
#
# THE TRAP, AND IT TAKES THE WHOLE STACK DOWN. This same server block answers
#
#   * the image's own HEALTHCHECK - `wget --spider http://127.0.0.1:18080/`;
#   * the operator's own LAN address, http://10.0.0.130:18080/ or whatever it
#     is, which is a plaintext path somebody may be keeping on purpose; and
#   * every request the TLS path itself delivers, because the edge speaks
#     http to us.
#
# NONE of those carries `X-Forwarded-Proto`, except the last, which carries
# `https`. So "no https, therefore redirect" is not a rule, it is an outage:
# the health check gets a 307 to a host it cannot resolve, wget exits non-zero,
# compose marks the container unhealthy, `restart: unless-stopped` restarts it,
# and the stack loops. Worse, keying on the Host alone loops the TLS path
# itself - the edge forwards the public Host, so a request that already IS
# https gets redirected to https forever.
#
# THE DISCRIMINATOR IS BOTH FACTS AT ONCE, AND ONLY A PUBLIC VISITOR HAS BOTH.
#
#     the browser's scheme is http   AND   the Host is the configured public one
#
# `$kaicalc_client_proto` is the first - the map directly above, which is
# already this file's answer to "what scheme did the browser really use", and
# reusing it means the redirect cannot disagree with what the applications are
# told. `$host` is the second, and it is what every internal caller lacks:
#
#     caller                     $kaicalc_client_proto   $host              redirect
#     -------------------------  ---------------------   ----------------   --------
#     HEALTHCHECK (wget)         http                    127.0.0.1          no
#     operator on the LAN        http                    10.0.0.130         no
#     visitor through the edge   https                   the public host    no
#     visitor on the bypass      http                    the public host    YES
#
# `$host` and not `$http_host` on purpose: nginx lower-cases `$host` and strips
# the port, so ONE key matches the visitor arriving on `:18080` and the edge's
# request arriving with no port at all. `$http_host` would need two keys and
# would silently stop matching the day the operator publishes a third port.
#
# WHAT WAS REJECTED, AND WHY.
#
#   `$http_x_forwarded_proto` alone. Breaks the health check and the LAN path
#   exactly as described above, believes a header from any caller whenever
#   trust is off, and cannot build the Location anyway: a request that never
#   carried the public name cannot be redirected to it. The target has to be
#   configuration whatever the condition is, and once it is, the condition may
#   as well use it.
#
#   A second listener for the health check (`listen 18081`). Moves EXPOSE, the
#   HEALTHCHECK and compose, and still redirects the operator's own LAN
#   address, because it separates "the health check" from "everybody else"
#   rather than "a public visitor" from "everybody else" - which is the
#   distinction the deployment actually needs.
#
#   A path exclusion (`location = /healthz { return 200; }`). Same defect, one
#   size smaller, plus it stops the health check exercising what a visitor
#   gets. A health check that reported healthy over a socket the real server
#   had not bound is already on this repository's list; a second one that
#   passes because it is exempt from the rule under test would be the same
#   mistake with a different name.
#
#   `$server_addr`. Inside the container that is this container's own address
#   on the compose network, identically for the health check and for a visitor
#   from the internet. It cannot tell them apart at all. `$remote_addr` could,
#   but only with the edge's address written into this file, and this file has
#   just finished arguing why `set_real_ip_from` was not taken.
#
# HOST IS SPOOFABLE, AND THAT COSTS NOTHING. Anyone who can reach :18080 can
# send the public Host and collect a 307 to the real site. The Location is a
# configured literal, never a string derived from the request, so this cannot
# become an open redirect - which is the only thing spoofing it could buy.
#
# UNSET IS NO REDIRECT, AND THAT IS TWICE OVER. With `KAICALC_PUBLIC_ORIGIN`
# absent - the state every existing deployment is in - both placeholders render
# empty, so the single entry below becomes `"http:" ""`. Its VALUE is empty and
# the `if` in the server block treats an empty variable as false, so nothing
# redirects even if the key matched; and the key cannot match, because `$host`
# falls back to `server_name` (`_`) when no Host header arrives and is never
# the empty string. Either one alone would be enough.
#
# THE PAIRING IS ENFORCED AT START-UP, NOT ASSUMED. Setting this origin while
# `KAICALC_TRUST_FORWARDED_HEADERS` is off gives `$kaicalc_client_proto` the
# constant value `http`, so the edge's own requests match the key and the TLS
# path becomes an infinite redirect. docker/web-config.sh REFUSES to start the
# container on that combination. It is a refusal rather than the warning
# PROTECTION_TRUSTED_PROXY gets because both values are read by that same
# script and govern this same nginx - the contradiction is first-hand here,
# where that one is second-hand.
# ---------------------------------------------------------------------------
map "$kaicalc_client_proto:$host" $kaicalc_https_redirect {
    default                            "";
    "http:${KAICALC_PUBLIC_HOST}"      "${KAICALC_PUBLIC_REDIRECT}";
}

server {
    # 18080, not 80. Two reasons, and both matter:
    #   - a clean machine very often already has something on 80/8000/8080/
    #     3000/5000, and a port clash on the first `docker compose up` is the
    #     out-of-the-box failure this whole arrangement exists to prevent; and
    #   - a port above 1024 can be bound by an unprivileged user, which is what
    #     lets this container run as `nginx` rather than as root.
    listen 18080;
    listen [::]:18080;
    server_name _;

    # The calculator is a static site: HTML, CSS, ES modules, two self-hosted
    # woff2 faces and the brand imagery. No build step, no bundler.
    root /usr/share/nginx/html;

    # `home.html`, NOT `index.html`, AND NOT A REDIRECT.
    #
    # index.html is the calculator. home.html is the page that says what the
    # tool is, what to have to hand, where the numbers come from and what the
    # statistics are not - and it is first in every public page's navigation.
    # While this directive said `index.html`, the calculator was the de-facto
    # home page and nobody who typed the address ever learned home.html existed.
    #
    # A `return 302 /home.html` would have done the same job and is worse: it
    # shows the reader a hop, costs a round trip before the first byte of HTML,
    # and gives the page two URLs with no canonical between them. `index` serves
    # the file AT `/`, so `/` is the home page's address rather than a signpost
    # to it.
    #
    # NOT A VARIABLE, and deliberately not one. Everything a deployment can
    # change in this file is rendered by docker/web-config.sh from an explicit
    # envsubst list; which file is the home page is a property of the front end,
    # not of the deployment, and adding a name to that list is a name envsubst is
    # then licensed to replace everywhere it appears.
    index home.html;

    # Nothing here is a secret, but the version banner is free information for
    # anyone scanning.
    server_tokens off;

    # nginx's OWN redirects - the 301 it issues when a directory path arrives
    # without its trailing slash - are built from `$host:$server_port`, and
    # $server_port is the port INSIDE the container (18080), not the port the
    # client connected to. Published on any other host port, or fronted by TLS
    # on 443, every such redirect sends the browser somewhere that is not
    # listening. This is the same class of bug as the `Host $host` one in
    # kaicalc_proxy_headers.conf, in the half of the file that has no
    # proxy_set_header to get wrong: `off` emits a path-only Location and lets
    # the browser keep the origin it already has, which is correct under every
    # port and scheme.
    absolute_redirect off;

    # A PUBLIC VISITOR WHO ARRIVED IN THE CLEAR, AND NOBODY ELSE. The map above
    # this server block is the whole condition and carries the whole argument;
    # what is left here is the three decisions this line makes.
    #
    # 307, NOT 301 AND NOT 308, AND THE USUAL FRAMING OF THAT CHOICE IS WRONG.
    # "301 is cached forever, so use 308" trades nothing away: RFC 9110 15.4.9
    # makes 308 permanent and cacheable by default on exactly the same terms as
    # 301. Both would be remembered by browsers long after this variable was
    # unset, and the operator who later wants the plaintext path back would be
    # unable to reach it from any browser that had ever seen the redirect - with
    # no server-side way to withdraw it. The two axes are independent:
    #
    #                    rewrites POST to GET   preserves the method
    #     permanent      301                    308
    #     temporary      302                    307
    #
    # 307 is the only cell that keeps the method without the permanent cache,
    # and both halves are load-bearing here. THE COST is one round trip per
    # plaintext request, uncached, forever - which is the right price for a rule
    # whose entire condition is a variable an operator may unset, and which must
    # therefore be re-decided by the server on every request rather than
    # remembered by the client.
    #
    # `/api/v1/` IS REDIRECTED TOO, DELIBERATELY. A 307 to a JSON client is not
    # free: a caller that does not follow redirects sees a 307 where it expected
    # a body. It is still right in all three directions that matter. The method
    # and the body survive for every client that does follow, so a POST
    # /api/v1/calculate completes against https rather than failing; a client
    # that does not follow gets a status and a `Location` naming exactly where
    # to go, which is diagnosable in a way that today's plaintext 200 is not;
    # and excluding it would leave POST /api/v1/calculate - the one request in
    # this system carrying a visitor's own figures, which are then PERSISTED -
    # as the only thing still readable on the wire on the public hostname. That
    # inverts the point of the rule. The front end never meets this: a plaintext
    # page load is redirected before a single module is fetched, and a page
    # served over https makes its relative /api/v1 calls over https.
    #
    # `$request_uri` IS THE FULL ORIGINAL - path and query string, before any
    # rewriting - so the visitor lands on the page they asked for rather than on
    # the home page. `$uri` here would silently drop every query string, which
    # is the shape of mistake that survives testing because `/` has none.
    #
    # `if` IS SAFE IN THIS FORM. The warning against it ("if is evil") is about
    # `if` inside a `location` alongside other directives; `return` at server
    # level is one of the two uses the nginx documentation states is reliable.
    if ($kaicalc_https_redirect) {
        return 307 $kaicalc_https_redirect$request_uri;
    }

    # Baseline response headers for the static origin. This is the origin the
    # calculator itself is served from, so these apply to the pages a member of
    # the public actually loads.
    #
    # The public-page Content-Security-Policy is deliberately scoped to the
    # static `location /` below. The API and admin panel have different runtime
    # requirements and must not inherit a policy written for the public site.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/access.log kaicalc;

    # NO `Vary: Accept-Language` ON THE STATIC ORIGIN, AND THAT IS DELIBERATE.
    #
    # The calculator does not negotiate. It is static files that never reach
    # FastAPI: every visitor is served the same index.html, and
    # web/js/i18n.js picks a catalogue from `navigator.languages` inside the
    # browser. Nothing about these responses varies by the header, so there
    # is nothing here for a cache to get wrong.
    #
    # Declaring it anyway would not be harmless. Accept-Language is close to
    # unique per browser, so `Vary` on it tells every shared cache to keep a
    # separate copy of index.html, styles.css and both font faces per header
    # value - a cache that stores everything and hits on nothing.
    #
    # The panel is the half that negotiates, and it sets the header itself in
    # admin/i18n.py's LanguageMiddleware, on every response including the
    # ones its protection middleware refuses. `proxy_pass` below passes it
    # through untouched.

    # Decimals are transmitted as strings and the payloads are small; gzip is
    # still worth it for the ES modules and the CSS.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A calculate request carries one entry per row of the form. 1 MiB is far
    # more than the contract's shape needs and far less than an accident.
    client_max_body_size 1m;

    # ---------------------------------------------------------------------
    # The static front end
    # ---------------------------------------------------------------------
    #
    # `autoindex off` is nginx's default. It is stated anyway because this
    # block is the public site's boundary, and an intent that is only implicit
    # is one somebody removes later without knowing it was load-bearing. A
    # directory listing here would enumerate the front end's source layout.
    autoindex off;

    location / {
        # A location-level add_header stops nginx inheriting the server-level
        # add_header directives above, so repeat the three baseline headers to
        # preserve the public site's existing response-header behaviour.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # `script-src 'self'` covers the vendored Chart.js and web/js/config.js,
        # which is a generated same-origin module rather than an inline block
        # precisely so that this directive does not have to be relaxed;
        # `style-src-attr 'unsafe-inline'` is what improvement.js's one inline
        # `style="margin-inline-start:${offset}%"` needs.
        #
        # **`connect-src` and `img-src` ARE THE TWO PLACEHOLDERS.**
        # docker/web-config.sh builds them, and it builds web/js/config.js from
        # the same variables in the same run, so the policy and the page cannot
        # disagree about where the news feed or the API is. Unconfigured they
        # render to exactly
        #
        #     img-src 'self' data:;  connect-src 'self'
        #
        # which is what this file used to say minus the client's domain, and
        # the front end asks nobody for news rather than guessing a host.
        # Configured, each gains only the origins an operator named:
        # KAICALC_NEWS_ORIGIN (both directives), KAICALC_API_ORIGIN
        # (connect-src), KAICALC_NEWS_IMAGE_ORIGINS (img-src, for a media CDN).
        #
        # `img-src` following the news origin is a change of position and the
        # reasoning is on `createNewsCard` in web/js/home.js: the directive was
        # kept narrow because widening it meant *guessing* the origin, and there
        # is no guess left to make. tests/web/test_csp.py still fails by name
        # with the blocked URI the first time a public page is refused anything.
        #
        # **`style-src 'self'` refuses Playwright's `add_style_tag`**, which is
        # how this suite injects its measurement and mutation stylesheets. The
        # browser test files set `bypass_csp` for that reason; tests/web/
        # test_csp.py is the one that runs with the policy on.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src ${KAICALC_CSP_IMG_SRC}; connect-src ${KAICALC_CSP_CONNECT_SRC}" always;

        # THIS BLOCK USED TO EMIT NO CACHE DIRECTIVE AT ALL, AND THAT WAS A BUG.
        #
        # A response with no `Cache-Control` and no `Expires` is not
        # uncacheable. RFC 9111 section 4.2.2 lets a cache invent a freshness
        # lifetime from `Last-Modified`, and every one of them does - Chromium
        # and Firefox both use a tenth of the document's age. nginx sets
        # `Last-Modified` from the file's mtime, so a module that had not been
        # touched for a month arrived at a browser already licensed to be
        # reused for three days WITHOUT ASKING, starting from the deploy that
        # served it.
        #
        # **Nothing here is fingerprinted.** There is no build step and no
        # bundler (that is a deliberate decision, not an omission), so
        # `calculator.js` is `calculator.js` in every release and a browser has
        # no way to tell this release's copy from the last one by its URL.
        #
        # The sharpest case is `web/js/config.js`, which
        # `docker/web-config.sh` GENERATES AT CONTAINER START from
        # `KAICALC_API_ORIGIN` - and which builds the `connect-src` of the
        # header directly above from that same variable in the same run. The
        # two are written together precisely so they cannot disagree, and
        # heuristic freshness pulled them apart again from the other end: a
        # returning browser runs the PREVIOUS release's `config.js`, holding
        # the previous API origin, under THIS release's policy. The result is a
        # fetch the browser refuses, reported to the page as a bare network
        # error with nothing in it that names the cause. The twenty catalogues
        # under `web/locales/` and every other ES module carry the same
        # exposure; `config.js` is only the one where the mismatch is
        # guaranteed rather than likely.
        #
        # `no-cache` IS NOT `no-store`. The response is still stored; the
        # browser must simply revalidate before reusing it. These are static
        # files, so nginx answers that revalidation from `ETag` /
        # `Last-Modified` with a 304 and no body - one small conditional
        # request per asset, not a re-download.
        #
        # The two woff2 faces are included rather than excepted. A font served
        # from the previous release under this release's stylesheet is the same
        # class of failure, and two conditional requests are not worth carving
        # a second location block - with its own copy of all four headers
        # above - out of the one boundary the public site has.
        #
        # NOT A VARIABLE, for the reason `index home.html` is not one: what a
        # deployment may change here is rendered by docker/web-config.sh from
        # an explicit envsubst name list, and how long the front end may be
        # stale is a property of the front end, not of the deployment.
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ =404;
    }

    # A directory that exists without an index file falls through to nginx's
    # built-in 403, while a path that does not exist gives 404 - and that
    # difference tells an outsider which directories are real. Both now land
    # on the same redirect, so `/js/` and `/nonexistent/` are indistinguishable
    # from outside.
    #
    # A redirect rather than a 404 page because the visitor asked for
    # something that is not a page: the useful thing is the calculator, not a
    # dead end. `$http_host` rather than a bare `/` keeps the port, which
    # matters because the default publish port is 18080; and it is built from
    # the request's own host rather than from a target an outsider supplies, so
    # this cannot become an open redirect.
    #
    # `$kaicalc_client_proto`, NOT `$scheme`, AND THAT WAS A LIVE DEFECT.
    # `$scheme` is what THIS server was reached on, which behind a TLS
    # terminator is always `http`. So a 404 on the https path answered
    # `Location: http://<public host>/` - port 80, on a deployment whose
    # operator may deliberately have nothing listening there, which is a dead
    # end reached by mistyping a URL on a working site. It is the same class of
    # bug as the `$server_port` one `absolute_redirect off` above fixes and as
    # the `Host $host` one in kaicalc_proxy_headers.conf: a Location assembled
    # from what this hop saw rather than from what the browser used. The
    # variable is this file's existing answer to that question and resolves to
    # `$scheme` whenever forwarded headers are not trusted, so every deployment
    # that is not behind an edge is unaffected.
    #
    # This applies to the static root only. `/api/v1/` sets its own
    # `error_page` below so a missing endpoint still answers with the section 9
    # JSON envelope - a front end branching on `error.code` must never be
    # handed an HTML redirect. `/admin`'s 403 is E-8's protection middleware
    # deliberately refusing a headless client, and is proxied, so it never
    # reaches this handler.
    error_page 403 404 = @not_a_page;

    location @not_a_page {
        return 302 $kaicalc_client_proto://$http_host/;
    }

    # ---------------------------------------------------------------------
    # The public API
    # ---------------------------------------------------------------------
    #
    # `proxy_pass` with NO URI part (no trailing slash, no path) is what
    # preserves the request path. http://api:18000/ - with the slash - would
    # rewrite /api/v1/calculate to /calculate and every route would 404, which
    # is the single most common way this file gets broken.
    location /api/v1/ {
        proxy_pass http://api:18000;
        include /etc/nginx/kaicalc_proxy_headers.conf;

        # nginx's default, stated because the static root's `error_page` above
        # is inherited here and this is what stops it applying. A 404 from the
        # API is the section 9 JSON envelope, and a front end branching on
        # `error.code` must never be handed an HTML redirect instead.
        proxy_intercept_errors off;
    }

    # ---------------------------------------------------------------------
    # The staff admin panel -- ROUTED BY DEFAULT, DELIBERATELY
    # ---------------------------------------------------------------------
    #
    # Publishing an admin panel on the public origin is not a decision anyone
    # should make by accident, so here is the reasoning in full.
    #
    # On a headless server there is no other way in. Port 18001 has no browser
    # in front of it, and the panel is a browser-only surface - MFA enrolment
    # is a QR code, the factor editor is a set of HTML forms. Omitting this
    # block means the system cannot be administered at all out of the box:
    # no factor set can be published, no account can be enrolled, no IP block
    # can be lifted through the UI. That is a worse failure than the exposure
    # it avoids.
    #
    # The panel is not bare. It has TOTP MFA, per-account login throttling
    # with lockout, a server-side IP blocklist checked ahead of every other
    # rule, headless-client detection, and a per-address rate limiter
    # (admin/protection.py). E-8 - the blocklist and its `kaicalc-admin
    # unblock` escape hatch - exists precisely so this route can be published.
    #
    # Whoever deploys this is still expected to put a WAF, an IP allowlist or
    # a network boundary in front of /admin.
    #
    # TO REMOVE IT: delete this one location block. Nothing else references it.
    # THE COST OF REMOVING IT: administration becomes CLI-only, through
    #
    #   docker exec kaicalc-admin kaicalc <command>
    #
    # `kaicalc`, NOT `kaicalc-admin`. The second is the console script and it
    # fails here with `MissingSettingError: SECRET_KEY is not set`, because
    # `docker exec` does not run the image's entrypoint and so inherits none of
    # the environment the entrypoint builds - including the generated secret.
    # `kaicalc` is the wrapper that resolves it first and then calls the same
    # command (docker/kaicalc-wrapper.sh; compose.yaml's header and
    # entrypoint.sh both use this form). `kaicalc-admin --help` does work, which
    # is exactly what makes the wrong form look correct until it is needed.
    #
    # That distinction is written out here rather than left to the reader
    # because this paragraph has one audience: somebody shut out of the panel,
    # reaching for `unblock`. It is the worst moment to hand them a command
    # that fails for an unrelated reason.
    #
    # CLI-only covers create-staff, reset-mfa, issue-password, rotate-key,
    # unblock, bootstrap and seed-taxonomy - and NOT publishing a factor set,
    # editing a formula, or reading the audit log, none of which has a CLI.
    # In that arrangement the panel is reached by tunnelling to port 18001.
    location /admin {
        proxy_pass http://admin:18001;
        include /etc/nginx/kaicalc_proxy_headers.conf;

        # As above. The panel's 403 is E-8's protection middleware refusing a
        # headless client on purpose; redirecting it to the calculator would
        # turn a deliberate refusal into a broken-looking bounce.
        proxy_intercept_errors off;
    }
}

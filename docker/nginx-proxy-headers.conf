# Headers set on every proxied request, included by both location blocks in
# nginx.conf so the two cannot drift apart.

proxy_http_version 1.1;

# $http_host, NOT $host. They differ in exactly one way and it is the way that
# matters here: $host has the port stripped off, $http_host is the Host header
# the client actually sent, port and all. Starlette builds its redirects from
# this header, and sqladmin answers /admin with a 307 to /admin/ - so with
# $host, a browser on http://localhost:18080/admin was redirected to
# http://localhost/admin/ (port 80, nothing listening) and the panel was
# unreachable through the proxy. Observed, not theorised.
proxy_set_header Host              $http_host;

# The peer this nginx is actually talking to, by definition - the visitor when
# this proxy is the outermost one, the edge when it is not. Nothing in api/ or
# admin/ reads it; it is kept because it is what an operator's other tooling
# expects to find, and it is deliberately NOT switched by the trust flag below
# so that there is always one header stating the unembellished truth about the
# connection. Read the address of the VISITOR out of X-Forwarded-For.
proxy_set_header X-Real-IP         $remote_addr;

# X-Forwarded-For AND X-Forwarded-Proto: BOTH COME FROM THE `map` BLOCKS IN
# nginx.conf, AND WHICH BRANCH THEY TAKE IS ONE OPT-IN SETTING.
#
# These two lines used to read `$remote_addr` and `$scheme`, which is correct
# while this nginx is the outermost proxy and wrong the moment an edge that
# somebody else operates terminates TLS in front of it - then the panel is
# told the request is not on TLS, and every visitor on earth arrives as the
# edge's one address. `KAICALC_TRUST_FORWARDED_HEADERS` is what says an edge
# is really there; docker/nginx.conf carries the full argument, including why
# it is a separate setting from PROTECTION_TRUSTED_PROXY rather than the same
# one.
#
# WITH IT OFF - the default, and the shipped arrangement - these resolve to
# exactly what this file said before: `$remote_addr` and `$scheme`. An inbound
# X-Forwarded-For is thrown away rather than appended to. That refusal is the
# whole of the old note here and it still holds: $proxy_add_x_forwarded_for
# would append the real address to whatever the caller sent, producing
# "1.2.3.4, 172.18.0.1" for a caller who simply chose to send
# `X-Forwarded-For: 1.2.3.4`, and both applications read the LEFT-MOST entry
# (db/detection.py's client_ip: "the left-most entry is the original client"),
# so the caller would have named their own address - out of the rate-limit
# bucket and out of the ip_block list. Overwriting is what makes the header
# trustworthy, and it is exactly the condition admin/config.py names before
# PROTECTION_TRUSTED_PROXY may be turned on.
#
# WITH IT ON, the inbound values are believed: the scheme if it is exactly
# `http` or `https`, and the chain with this proxy's peer appended so the
# left-most entry stays the visitor the edge saw.
proxy_set_header X-Forwarded-For   $kaicalc_client_addr;
proxy_set_header X-Forwarded-Proto $kaicalc_client_proto;

# WHAT MAKES THE APPLICATIONS ACTUALLY TRUST THE TWO HEADERS ABOVE:
#
#     PROTECTION_TRUSTED_PROXY=true
#
# One environment variable, read by BOTH api/app.py and admin/config.py - one
# deployment fact, one setting. It is false by default and docker/compose.yaml
# leaves it false. Until it is true, every caller is measured by the TCP
# address this proxy connects from - which is this container's address, the
# same one for every visitor on earth. Concretely, from api/router.py:
#
#     _limit(request, "get",            600)   # /taxonomy, /factors, /stats
#     _limit(request, "post-calculate", 120)   # /calculate
#
# over api/rate_limit.py's 3600-second sliding window. So with this false those
# are not 600 page loads and 120 calculations PER VISITOR PER HOUR, they are
# 600 and 120 SITE-WIDE PER HOUR, shared by everyone. A single classroom
# working through the calculator together exhausts the calculate budget, and
# the 121st visitor of the hour gets a 429 telling them to try again later.
#
# And one blocklist entry - applied to what staff believe is one abusive
# visitor - denies EVERY visitor at once, because there is only one address in
# play to block.
#
# So it wants turning on. But turning it on is only safe once THIS PROXY IS
# THE ONLY WAY IN. docker/compose.yaml publishes api on 18000 and admin on
# 18001 for local development, and while those are published a caller can
# reach the applications directly and send any X-Forwarded-For they like -
# at which point trusting the header is strictly worse than not trusting it,
# because a forged address bypasses the blocklist entirely.
#
# The edit is therefore a PAIR, and both halves must land together:
#   1. remove the `ports:` blocks from the api and admin services, and
#   2. set PROTECTION_TRUSTED_PROXY=true on both.
# compose.yaml says the same thing at the point where those ports are declared.
#
# AND IF SOMEBODY ELSE'S PROXY IS IN FRONT OF THIS ONE, THERE IS A THIRD:
#   3. set KAICALC_TRUST_FORWARDED_HEADERS=true on the `web` service.
# Without it, steps 1 and 2 make the applications trust a header that faithfully
# reports the EDGE's address for every visitor - one bucket, one block, everyone.
# With it and without step 2, nginx forwards the visitor's address and the
# applications ignore it; web-config.sh prints a warning at start-up for that
# combination, because it is the one that looks configured and does nothing.
#
# The two settings are separate on purpose and the reasoning is in
# docker/nginx.conf: PROTECTION_TRUSTED_PROXY is about the hop from this proxy
# to the applications, KAICALC_TRUST_FORWARDED_HEADERS is about the hop into
# this proxy. Only turn the second on when the first hop's own promise - that
# nothing can reach :18080 except through the edge - is true.

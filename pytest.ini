[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -q --strict-markers
markers =
    db: requires a running MySQL instance (docker compose up -d)
    browser: drives a real browser against the running stack on http://localhost:18080
             (docker compose up -d --build web admin). Skipped, never failed, when the
             stack is not up: the suite must stay runnable on a checkout, and a test
             that red-lights for an absent container teaches people to ignore it.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

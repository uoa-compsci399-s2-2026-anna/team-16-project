# THE WHOLE SYSTEM. One command:
#
#     docker compose -f docker/compose.yaml up
#
# and then http://localhost:18080/ is a working calculator - migrated, seeded,
# with a published (placeholder) factor set and two administrator accounts
# whose one-time passwords are printed in `docker compose logs migrate`.
#
# TWO COMPOSE FILES, TWO JOBS. Do not confuse them:
#
#   ../docker-compose.yml   the DEVELOPMENT DATABASE ONLY. One MySQL container,
#                           published on host port 3307, for running the test
#                           suite and the application from a checkout. It
#                           starts no application service and never will.
#   docker/compose.yaml     THIS FILE. The whole deployment: database, a
#                           one-shot migrate/seed job, the API, the admin panel
#                           and nginx.
#
# The two can run side by side: this file's database is not published at all
# and its containers are named differently.
#
# PORTS. NGINX IS THE ONLY WAY IN, AND THAT IS WHAT MAKES THE PROTECTION WORK.
# Exactly one port is published:
#
#   KAICALC_WEB_PORT     18080   nginx - the calculator, the API and the panel
#   api / admin           ----   NOT PUBLISHED. Reached through nginx.
#   MySQL                 ----   NOT PUBLISHED. Compose-internal only.
#
# 18080 is a high port on purpose: nothing here binds 80, 8000, 8080, 3000 or
# 5000, because a clean machine very often has something on all of them
# already and a port clash on the first `up` is precisely the out-of-the-box
# failure this arrangement exists to prevent (8000 was already occupied on the
# machine this was developed on).
#
# THE API AND THE PANEL USED TO BE PUBLISHED ON 18000 AND 18001, AND STOPPING
# THAT IS WHAT LETS `PROTECTION_TRUSTED_PROXY` DEFAULT TO true BELOW. While
# they were published, a caller could reach either application directly and
# send any `X-Forwarded-For` it liked, so the applications could not be
# allowed to believe that header - and not believing it meant every proxied
# visitor arrived as this nginx's one container address: one rate-limit
# bucket for everyone, and one `ip_block` row denying everyone. Measured, both
# ways round, on the running stack; the note beside the setting on the `api`
# service has the numbers.
#
# YOU CAN HAVE THEM BACK, AS ONE COMMAND AND AS A MATCHED PAIR:
#
#     docker compose -f docker/compose.yaml -f docker/compose.direct-ports.yaml up
#
# That override republishes both ports AND puts `PROTECTION_TRUSTED_PROXY`
# back to false, because those two facts must move together and putting them
# in one file is the only way this project has found to stop half of the pair
# landing on its own. Read its header before you use it.
#
# RUNNING AN ADMIN COMMAND AGAINST A LIVE STACK.
#
#     docker exec kaicalc-admin kaicalc unblock 203.0.113.5
#     docker exec kaicalc-admin kaicalc issue-password alice
#
# `kaicalc` (not `kaicalc-admin`) is the wrapper that resolves SECRET_KEY
# first - `docker exec` does not run the image's entrypoint and inherits none
# of its environment. `kaicalc-admin --help` still works directly, because
# argparse prints help before any setting is read. docker/kaicalc-wrapper.sh.
#
# TEARDOWN.
#   docker compose -f docker/compose.yaml down      keeps the data and the secret
#   docker compose -f docker/compose.yaml down -v   destroys both, and the next
#                                                   `up` bootstraps from nothing
#                                                   (new SECRET_KEY, new
#                                                   administrator passwords)

name: kaicalc

services:

  # -------------------------------------------------------------------------
  # The database. Not published: nothing outside this network needs it, and a
  # published MySQL is the one service on this list that an unattended machine
  # will be scanned for. Reach it with
  #   docker compose -f docker/compose.yaml exec db mysql -ukaicalc -p kaicalc
  # -------------------------------------------------------------------------
  db:
    # Pinned by digest for the same reason the Dockerfiles pin theirs: a
    # floating tag means the database a client starts in six months is not the
    # one this was verified against, and a MySQL point release that changes a
    # default is exactly the kind of thing nobody attributes correctly. YAML
    # does have end-of-line comments, so the human tag can sit inline here.
    image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b   # mysql:8.0
    container_name: kaicalc-stack-db
    restart: unless-stopped
    environment:
      # Change these for anything that is not a laptop. They are not reachable
      # from outside the compose network, but "not reachable today" is a
      # property of this file rather than of the password.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kaicalc}
      MYSQL_USER: ${MYSQL_USER:-kaicalc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    # utf8mb4 throughout: the taxonomy carries macrons (Kai, te reo names) and
    # the metric display units carry a subscript ("kg CO₂e").
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # THIS CHECK SPEAKS TCP, AND THAT IS THE ENTIRE POINT OF IT.
      #
      # It used to be `mysqladmin ping -h localhost`, and that check reported
      # healthy roughly two seconds BEFORE the database existed. Measured, on a
      # clean machine:
      #
      #   04:54:04.29  healthcheck exits 0   (temporary server, "port: 0")
      #   04:54:04.83  migrate starts
      #   04:54:06.30  migrate dies: (2003, "Can't connect to MySQL server on
      #                'db' ([Errno 111] Connection refused)")
      #   04:54:06.89  the real server binds 3306 - 0.6 s too late
      #
      # migrate exits non-zero, so api, admin and web never start at all
      # (`service_completed_successfully` is never met) and the site answers
      # nothing. The second `up -d` works, because migrate is idempotent, which
      # is why this was reported as "it needs starting twice" rather than as a
      # bug. Three things combine:
      #
      #   1. mysql:8.0's entrypoint runs a TEMPORARY server for the duration of
      #      initialisation, with --skip-networking. Its own log says
      #      "ready for connections ... port: 0". No TCP socket exists yet.
      #   2. `-h localhost` makes a mysql client use the UNIX SOCKET, not TCP -
      #      so it reaches that temporary server.
      #   3. `mysqladmin ping` EXITS 0 while printing "Access denied": to the
      #      ping command a server that refuses your credentials is still a
      #      server that answered.
      #
      # start_period cannot fix this. start_period suppresses FAILURES during
      # the window; it does not suppress a premature SUCCESS, and a success is
      # what this was producing.
      #
      # So: `--protocol=TCP` with an address rather than `localhost` (both,
      # deliberately - the flag survives someone "tidying" the address back),
      # against the port the application will use, AND a real query as the
      # application's own user against the application's own database. The
      # temporary server has no TCP listener to accept any of it, and a
      # connection refused is a non-zero exit, which is a failure, which is
      # what retries and start_period are for. Nothing but the real server,
      # with the real grants applied, can answer this.
      test: ["CMD", "mysql",
             "--protocol=TCP", "-h", "127.0.0.1", "-P", "3306",
             "-u", "${MYSQL_USER:-kaicalc}", "-p${MYSQL_PASSWORD:-devpass}",
             "-D", "${MYSQL_DATABASE:-kaicalc}",
             "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # -------------------------------------------------------------------------
  # The one-shot job that makes an empty database usable: migrate, seed the
  # taxonomy, publish the mock factor set, create the administrators.
  # docker/init.sh is the sequence and says why each step is there.
  #
  # THIS IS DEPLOYMENT FACT 1 EXPRESSED IN THE TOPOLOGY RATHER THAN IN A
  # README NOBODY READS. MySQL autocommits DDL, so two replicas running
  # `alembic upgrade head` at the same time interleave and leave a half-applied
  # schema stamped at a revision it does not match; recovery is DROP DATABASE.
  # One service, runs to completion, and every application service waits on
  # `service_completed_successfully` - so there is no arrangement of this file
  # in which two processes migrate concurrently, and no way to start the
  # application against a database that was never migrated.
  #
  # It runs the ADMIN image because the commands it runs are the admin CLI's.
  # The `build:` block is duplicated rather than omitted on purpose: with only
  # `image:` here, a first `up` on a clean machine would try to PULL
  # kaicalc-admin:local from a registry before the admin service had built it.
  # Two services naming one tag and one Dockerfile build once.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
    image: kaicalc-admin:local
    container_name: kaicalc-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-kaicalc}:${MYSQL_PASSWORD:-devpass}@db:3306/${MYSQL_DATABASE:-kaicalc}
      # Not used by the migration itself, but admin/config.py's load_settings()
      # is all-or-nothing - `kaicalc-admin seed-taxonomy` reads the whole
      # Settings object, so a missing SECRET_KEY would fail the seed step. The
      # entrypoint is what puts one there; see below.
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - secret:/var/lib/kaicalc
    command: ["/app/init.sh"]

  # -------------------------------------------------------------------------
  # The public JSON API.
  # -------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: kaicalc-api:local
    container_name: kaicalc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-kaicalc}:${MYSQL_PASSWORD:-devpass}@db:3306/${MYSQL_DATABASE:-kaicalc}
      # Empty by default. The entrypoint then generates one into the shared
      # `secret` volume, ONCE, and every service reads that same file - which
      # is deployment fact 2. Set this (or a real secret manager) in
      # production and the generation path becomes a no-op.
      #
      # Both applications derive the contract 2.3 blocklist fingerprint from
      # this value independently, with a pinned info string. Two different
      # secrets mean two different fingerprints for one address: a block
      # applied in the panel silently fails to hold at the API, with nothing
      # raised on either side. That is why it is a shared volume and not two
      # `openssl rand` calls.
      SECRET_KEY: ${SECRET_KEY:-}
      # TRUE HERE, AND THE `ports:` BLOCK THAT USED TO SIT BELOW IS WHY.
      #
      # It asks one question: may this application believe the
      # `X-Forwarded-For` that OUR nginx sends it? With nothing published but
      # 18080, the only process that can set that header on a request reaching
      # this service is our own nginx - and docker/nginx-proxy-headers.conf
      # OVERWRITES it with the peer nginx actually saw rather than appending
      # to whatever arrived, so a visitor cannot smuggle a value through it
      # either. Both halves are needed and both are now true, so the answer is
      # yes.
      #
      # WHAT IT COSTS TO GET THIS WRONG, IN BOTH DIRECTIONS, MEASURED RATHER
      # THAN REASONED ABOUT:
      #
      #   false WITH this proxy in front (what this file shipped until now).
      #   db/detection.py's client_ip reads the TCP peer, which is the nginx
      #   container - 172.20.0.5, the same value for every visitor on earth.
      #   api/router.py's 600 GETs and 120 calculates per hour stop being per
      #   visitor and become SITE-WIDE per hour, and one ip_block row denies
      #   everyone. Demonstrated on this stack: one container sent 34 requests
      #   through :18080, exhausted the panel's minute at the 30th, and a
      #   SECOND container's next request was refused 429 on its first try.
      #
      #   true with the direct ports published (the state this pairing
      #   forbids). A caller who skips nginx sets X-Forwarded-For to anything
      #   it likes and is measured as that address - out of the rate-limit
      #   bucket and out of the blocklist. Strictly worse than the above,
      #   which is why the ports had to go first and why
      #   docker/compose.direct-ports.yaml puts this back to false when it
      #   republishes them.
      #
      # THE CODE DEFAULT IS STILL false, AND THAT IS NOT A DISAGREEMENT.
      # api/app.py and admin/config.py cannot see their own topology: a bare
      # `./run.sh api` on a laptop has no proxy in front, and there `true`
      # would let any caller forge any address for nothing gained. This file
      # is the thing that MAKES nginx the only way in, so this file is the
      # thing entitled to assert it. One variable still governs both
      # applications (contract 6.5) - the same expansion is handed to api,
      # admin and web below, so the three cannot disagree.
      PROTECTION_TRUSTED_PROXY: ${PROTECTION_TRUSTED_PROXY:-true}
    volumes:
      - secret:/var/lib/kaicalc
    # NO `ports:`. nginx reaches this service over the compose network as
    # `api:18000`; the host does not need it and must not have it. See the
    # PORTS note at the head of this file, and docker/compose.direct-ports.yaml
    # if you want it back.
    healthcheck:
      # No curl in python:3.11-slim, and adding one for a health check is 4 MB
      # of attack surface for a one-line urllib call.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18000/openapi.json', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------------
  # The staff admin panel.
  # -------------------------------------------------------------------------
  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
    image: kaicalc-admin:local
    container_name: kaicalc-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-kaicalc}:${MYSQL_PASSWORD:-devpass}@db:3306/${MYSQL_DATABASE:-kaicalc}
      SECRET_KEY: ${SECRET_KEY:-}
      # The same expansion the api service above carries, with the same
      # default and for the same reason - one deployment fact, one setting
      # (contract 6.5). The long argument is on the api service; do not let
      # these two drift.
      PROTECTION_TRUSTED_PROXY: ${PROTECTION_TRUSTED_PROXY:-true}

      # WHERE THE PANEL FINDS POST /api/v1/calculate. Used by /admin/try (the
      # dry-run view) and by the pre-publish comparison view; both fail with
      # "service not reachable" without it.
      #
      # A SERVICE NAME, not a loopback address. 127.0.0.1 inside this
      # container is this container - the panel calling itself. admin/config.py
      # still defaults to http://127.0.0.1:8000, which is wrong in both the
      # port and the shape for any container deployment; this line is what
      # makes it right here. See the task 2 report for the recommendation on
      # the code default.
      API_BASE_URL: ${KAICALC_API_BASE_URL:-http://api:18000}

      # DEFAULTED TO FALSE HERE, AND THAT IS A DECISION WITH A COST.
      #
      # The setting marks the staff session cookie `Secure`, so a browser will
      # not send it over plain http. The shipped arrangement out of the box is
      # http://localhost:18080 with no TLS anywhere, and with this true the
      # login form accepts the password, sets a cookie the browser then
      # refuses to return, and bounces straight back to the login page - a
      # panel nobody can enter, which fails the whole point of this file.
      #
      # SET IT TO true THE MOMENT TLS IS IN FRONT. Over https, false is what
      # lets one plain-http navigation on the admin origin hand over a live
      # staff session.
      SESSION_HTTPS_ONLY: ${KAICALC_SESSION_HTTPS_ONLY:-false}
    volumes:
      - secret:/var/lib/kaicalc
    # NO `ports:`, for the reason given on the api service above. nginx reaches
    # the panel as `admin:18001` and serves it at /admin on 18080. A panel
    # published on its own port is a second, unproxied door into the one
    # application in this stack that can publish a factor set.
    healthcheck:
      # A TCP connect, not an HTTP request. Every HTML path under /admin is
      # behind ProtectionMiddleware's headless-client detection, which refuses
      # a caller with no browser headers - a health check written as a GET
      # would report the panel unhealthy for doing its job correctly.
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',18001),5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------------------
  # nginx: the static front end, and the only origin the browser talks to.
  # -------------------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: kaicalc-web:local
    container_name: kaicalc-web
    restart: unless-stopped
    depends_on:
      # BOTH must be resolvable before nginx starts, not just reachable. nginx
      # resolves an upstream host once, at configuration load, and refuses to
      # start at all if either name is unknown ("host not found in upstream").
      # `admin` waits on service_healthy rather than service_started for that
      # reason - a container that exists but has not bound its port yet is
      # resolvable, but a container that has failed to start is not.
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    environment:
      # THE ONLY PLACE THE CLIENT'S DOMAIN IS WRITTEN DOWN, AND IT IS NOT IN AN
      # IMAGE. docker/web-config.sh renders both the `connect-src`/`img-src` of
      # the public Content-Security-Policy and web/js/config.js from this one
      # value at container start, so the policy and the page cannot disagree
      # about where the news feed lives. It used to be written twice - api.js and
      # nginx.conf - and the two failed asymmetrically when they drifted: a wrong
      # policy means the news quietly does not load, a wrong URL means the browser
      # goes and asks a domain nobody chose. This project's deliverable is source
      # and documentation; DNS and hosting are out of scope, which is exactly why
      # the domain belongs to the deployment recipe and not to a built artefact.
      #
      # SET IT EMPTY AND THE HOME PAGE DROPS ITS NEWS SECTION ENTIRELY. That is a
      # supported deployment, not a degraded one - most installations of this
      # calculator have no WordPress behind them, and an unset origin is not an
      # error to report to a reader.
      #
      # `${VAR-default}`, NOT `${VAR:-default}`. With the colon an empty value in
      # the environment falls back to the default, so `KAICALC_NEWS_ORIGIN=` in a
      # .env would silently keep pointing at the client's site and there would be
      # no way to turn the feed off short of editing this file. Without it, unset
      # means the client's site and empty means no feed - which are two different
      # intentions and have to stay expressible separately.
      KAICALC_NEWS_ORIGIN: ${KAICALC_NEWS_ORIGIN-https://kaicommitment.org.nz}

      # EMPTY, AND IT SHOULD STAY EMPTY HERE. The front end builds `/api/v1`, a
      # relative path, and nginx routes it on: same-origin is the designed
      # topology and needs no configuration at all.
      #
      # It exists because the alternative was worse. Split the API onto its own
      # subdomain and the path in api.js and the `connect-src` in nginx.conf both
      # have to change, or every call is refused by our own policy with nothing in
      # the failure pointing at nginx - the same two-copies defect one layer up.
      # Set here, one value feeds both.
      #
      # **Weigh it as you would the nginx configuration itself.** This is the
      # front end of a tool whose numbers are the product, and pointing it at an
      # API the client does not control puts the client's branding over somebody
      # else's arithmetic. It is readable only from the operator's environment,
      # never from a URL a visitor can construct; the entrypoint refuses to start
      # on anything that is not a bare scheme://host[:port]; and `connect-src` is
      # generated from this same string, so the page can reach the one origin
      # named here and no other.
      KAICALC_API_ORIGIN: ${KAICALC_API_ORIGIN-}

      # img-src only, space-separated, for a WordPress media library that serves
      # from a CDN rather than from the site origin. Empty unless the client's
      # does. See the note on `createNewsCard` in web/js/home.js.
      KAICALC_NEWS_IMAGE_ORIGINS: ${KAICALC_NEWS_IMAGE_ORIGINS-}

      # IS THERE ANOTHER PROXY IN FRONT OF THIS ONE? Default false, and false
      # is what the shipped `docker compose up` wants: nginx then sets
      # X-Forwarded-Proto and X-Forwarded-For from what it saw itself and
      # throws away any inbound copy, so no caller can forge either.
      #
      # UNPUBLISHING api AND admin DID NOT CHANGE THIS ANSWER, AND THAT IS THE
      # DISTINCTION THIS PAIR OF SETTINGS EXISTS TO KEEP. That change says
      # nothing can reach the APPLICATIONS except through this nginx, which is
      # why PROTECTION_TRUSTED_PROXY above could become true. It says nothing
      # whatever about whether :18080 is reachable from the internet - on a
      # laptop and on a bare VPS it is, and a caller who reaches it directly
      # is exactly who this default refuses to believe. Only an operator who
      # knows an edge they run is the only route to :18080 may set this true.
      #
      # Set it true when somebody else's TLS terminator fronts this stack -
      # the ordinary shape on a public IPv4 whose port 443 already belongs to
      # another site:
      #
      #     browser --https--> their nginx :443 --http--> this stack :18080
      #
      # Left false in that topology the panel is told the request is not on
      # TLS, and every visitor arrives as the edge's single address. Set true
      # while this nginx is directly reachable and any caller can claim any
      # address and strip Secure off a live staff session cookie. It is
      # therefore a statement about the network, not a preference.
      #
      # SEPARATE FROM PROTECTION_TRUSTED_PROXY ON PURPOSE - that one is about
      # the hop from nginx to the applications, this one about the hop into
      # nginx, and all four combinations are real deployments. See
      # docker/nginx.conf.
      KAICALC_TRUST_FORWARDED_HEADERS: ${KAICALC_TRUST_FORWARDED_HEADERS:-false}

      # Not read by nginx. It is here so docker/web-config.sh can warn at
      # start-up about the one combination that silently does nothing:
      # this proxy forwarding the visitor's real address while api/ and admin/
      # are still configured to ignore X-Forwarded-For. Same expansion as the
      # api and admin services above, so the three cannot disagree.
      PROTECTION_TRUSTED_PROXY: ${PROTECTION_TRUSTED_PROXY:-true}
    ports:
      - "${KAICALC_WEB_PORT:-18080}:18080"

volumes:
  db-data:
  # One file: the generated SECRET_KEY. Mounted into every application service
  # and into the migrate job, which is what guarantees they all read the same
  # value and that it survives a restart. `down -v` removes it, which is
  # correct - it removes the database in the same breath, and a secret that
  # outlived the data it protects would be the worse of the two states.
  secret:
